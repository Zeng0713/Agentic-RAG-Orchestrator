[theme]
base = "dark"
primaryColor = "#C6D6A0"
backgroundColor = "#111617"
secondaryBackgroundColor = "#192022"
textColor = "#EDF0E8"
font = "sans serif"
baseRadius = "0.5rem"
showSidebarBorder = true
headingFontSizes = ["28px", "23px", "20px", "16px", "14px", "12px"]
headingFontWeights = [500, 500, 500, 500, 500, 500]

[theme.sidebar]
backgroundColor = "#0C1112"
secondaryBackgroundColor = "#192022"
textColor = "#EDF0E8"
